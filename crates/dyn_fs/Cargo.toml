[package]
name = "dyn_fs"
version = "0.0.0-local"
edition = "2024"
authors = ["alshdavid"]
repository = "https://github.com/alshdavid/dyn-fs"
description = "Abstraction for the std::fs stdlib"
license = "MIT"

[lib]

[features]
default = ["memory", "async"]
# Enables the in-memory `FileSystem` implementation (`dyn_fs::mem`).
memory = ["dep:normalize-path"]
# Enables the asynchronous API (`dyn_fs::asynch`). Combine with `memory` to
# include the in-memory backend under `dyn_fs::asynch::mem`.
async = []

[dependencies]
normalize-path = { version = "^0.2", optional = true }
tokio = { version = "1.53.3", features = ["full"] }
