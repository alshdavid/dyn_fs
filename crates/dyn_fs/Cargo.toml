[package]
name = "dyn_fs"
version = "0.0.0-local"
edition = "2024"
authors = ["alshdavid"]
repository = "https://github.com/alshdavid/dyn-fs"
description = "Abstraction for the std::fs stdlib"
license = "MIT"
keywords = ["fs", "filesystem", "async", "abstraction"]
categories = ["filesystem"]

[lints]
workspace = true

[lib]

[features]
default = []
# Enables the in-memory `FileSystem` implementation (`dyn_fs::mem`).
memory = ["dep:normalize-path"]
# Enables the asynchronous API (`dyn_fs::asynch`). Combine with `memory` to
# include the in-memory backend under `dyn_fs::asynch::mem`.
async = ["dep:tokio"]
# Enables the read-only backend backed by assets embedded with `include_dir`
# (`dyn_fs::include_dir`). Combine with `async` to include the asynchronous
# backend under `dyn_fs::asynch::include_dir`.
include_dir = ["dep:include_dir"]

[dependencies]
include_dir = { version = "0.7.4", optional = true }
normalize-path = { version = "^0.2", optional = true }
tokio = { version = "1.53.3", features = ["full"], optional = true }
