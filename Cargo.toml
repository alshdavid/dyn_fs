[workspace]
resolver = "2"

members = [
  "./crates/*",
  "./examples/basic_sync",
  "./examples/basic_sync_memory",
  "./examples/basic_sync_include_dir",
  "./examples/basic_async_tokio",
  "./examples/basic_async_memory",
  "./examples/basic_async_include_dir",
]

[profile.release]
opt-level = 3
debug = false
lto = true
strip = true
panic = 'unwind'
incremental = false
codegen-units = 1
rpath = false