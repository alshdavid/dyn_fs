[workspace]
resolver = "2"

members = [
  "./crates/*",
  "./examples/basic_sync",
  "./examples/basic_sync_memory",
  "./examples/basic_sync_include_dir",
  "./examples/basic_async_tokio",
  "./examples/basic_async_memory",
  "./examples/basic_async_include_dir",
]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
enum_glob_use = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
implicit_clone = "deny"
clone_on_ref_ptr = "deny"
rest_pat_in_fully_bound_structs = "deny"
missing_errors_doc = "allow"

[profile.release]
opt-level = 3
debug = false
lto = true
strip = true
panic = 'unwind'
incremental = false
codegen-units = 1
rpath = false